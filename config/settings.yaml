# =============================================================================
# Multi-Agent Deep Research System — Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# LLM Providers
# ---------------------------------------------------------------------------
llm:
  # Model ids change often. These were verified against the providers' model
  # lists on 2026-11-13; if a provider answers "model not found", list its
  # current models and update the id here.
  providers:
    groq:
      model: "openai/gpt-oss-120b"       # strongest reasoning model on Groq
      api_key_env: "GROQ_API_KEY"
      temperature_default: 0.2
    groq_fast:
      model: "openai/gpt-oss-20b"        # fast and cheap, for the parallel fan-out
      api_key_env: "GROQ_API_KEY"
      temperature_default: 0.2
    gemini:
      model: "gemini-flash-lite-latest"
      api_key_env: "GEMINI_API_KEY"
      temperature_default: 0.2
    openrouter:
      model: "meta-llama/llama-3.3-70b-instruct:free"
      api_key_env: "OPENROUTER_API_KEY"
      temperature_default: 0.2

  # Role -> provider mapping. Primary is tried first; on a failed call (rate
  # limit, outage) the same call is retried on each fallback in order.
  # max_retries: how many times the PRIMARY provider retries a rate-limited
  # call (it waits as the provider instructs) before handing over. The
  # reasoning-heavy roles wait for the strong model, because a weaker fallback
  # writes a visibly worse report; the high-volume roles hand over at once.
  roles:
    planner:
      primary: groq_fast
      fallback: [groq, gemini, openrouter]
      temperature: 0.2
    researcher:
      primary: groq_fast
      fallback: [gemini, groq, openrouter]
      temperature: 0.2
    analyst:
      primary: groq
      fallback: [gemini, groq_fast, openrouter]
      max_retries: 2
      temperature: 0.3
    critic:
      primary: groq
      fallback: [gemini, groq_fast, openrouter]
      max_retries: 2
      temperature: 0.2
    writer:
      primary: groq
      fallback: [gemini, groq_fast, openrouter]
      max_retries: 2
      temperature: 0.4
    editor:
      primary: groq_fast
      fallback: [gemini, groq, openrouter]
      temperature: 0.1

  # When true, all LLM calls return deterministic mock output (for tests/CI).
  mock_mode: false
  mock_latency_ms: 0           # Artificial delay per mock LLM call (UI demos)
  mock_scenario: "default"     # "default" or "self_heal" (one replan + one writer retry)

# ---------------------------------------------------------------------------
# Embeddings (for memory / dedup / similarity)
# ---------------------------------------------------------------------------
embeddings:
  provider: "local"            # "gemini" or "local"
  model: "all-MiniLM-L6-v2"   # sentence-transformers model for local

# ---------------------------------------------------------------------------
# Search tools
# ---------------------------------------------------------------------------
search:
  tavily_enabled: true
  duckduckgo_enabled: true
  max_results_per_query: 5

# ---------------------------------------------------------------------------
# Research pipeline
# ---------------------------------------------------------------------------
research:
  max_iterations: 3            # Total Critic→Researcher loops
  max_replan_iterations: 2     # Times we can loop back to the Planner
  enable_critic: true
  enable_editor: true
  require_human_approval: false
  hil_checkpoints:             # Where to place interrupt() calls
    - "after_planning"
    # - "after_critique"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
cache:
  enabled: true
  backend: "diskcache"         # "diskcache" or "redis"
  ttl_seconds: 3600
  directory: ".cache/research"
  redis_url: "redis://localhost:6379/0"

# ---------------------------------------------------------------------------
# Long-term memory
# ---------------------------------------------------------------------------
memory:
  enabled: true
  backend: "sqlite"            # "sqlite" or "redis"
  db_path: "data/research_memory.db"

# ---------------------------------------------------------------------------
# Observability / tracing
# ---------------------------------------------------------------------------
tracing:
  enabled: false
  provider: "langsmith"        # "langsmith" or "langfuse"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
api:
  enable_streaming: true
  version: "3.1.0"
  max_query_length: 500        # Characters accepted in a research query
  rate_limit_per_minute: 10    # Research starts per user per minute (0 = off)
  auth_rate_limit_per_minute: 10  # Sign-in/sign-up attempts per client IP per minute

# ---------------------------------------------------------------------------
# Background research runs
# ---------------------------------------------------------------------------
runs:
  timeout_seconds: 900           # A run that exceeds this is stopped and marked failed
  llm_timeout_seconds: 90        # Per LLM call; a hung provider cannot stall a run
  max_concurrent: 4              # Runs executing at once across all users; the rest queue
  max_active_per_user: 3         # Queued + running runs one user may have
  approval_timeout_seconds: 600  # A run awaiting approval is cancelled after this
